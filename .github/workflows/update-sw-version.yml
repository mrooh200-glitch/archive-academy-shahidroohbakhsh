name: Update Service Worker cache version
permissions:
  contents: write
on:
  push:
    branches: [main]
    # عمداً sw.js خودش این‌جا نیست: این workflow قراره نسخهٔ کش رو از
    # روی همین سه فایل بسازه، نه این‌که به تغییر خودش واکنش نشون بده -
    # اگه sw.js هم این‌جا بود، commitِ خودکارِ همین workflow دوباره
    # خودش رو trigger می‌کرد (حلقهٔ بی‌پایان). به‌عنوان یک لایهٔ ایمنیِ
    # دوم، گیت‌هاب هم به‌طور پیش‌فرض commitهایی که با همون GITHUB_TOKEN
    # پیش‌فرض push می‌شن رو دوباره trigger نمی‌کنه - ولی حذفِ sw.js از
    # این لیست، منطق رو هم روشن‌تر و مستقل از اون رفتارِ ضمنی می‌کنه.
    paths:
      - "index.htm"
      - "search-widget.js"
      - "in-page-search.js"
jobs:
  bump-sw-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update CACHE_VERSION in sw.js from commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short=8 HEAD)
          sed -i "s/const CACHE_VERSION = \"roohbakhsh-cache-[^\"]*\";/const CACHE_VERSION = \"roohbakhsh-cache-${SHORT_SHA}\";/" sw.js
          echo "New CACHE_VERSION: roohbakhsh-cache-${SHORT_SHA}"

      # اگر workflowِ embeddings هم‌زمان روی main کامیت کرده باشد، push ساده
      # با «non-fast-forward» رد می‌شود؛ پس قبل از push تغییرات تازه را
      # می‌گیریم (rebase) و در صورت رقابت چند بار دوباره تلاش می‌کنیم.
      - name: Commit sw.js back to repo
        run: |
          git add sw.js
          if git diff --cached --quiet; then
            echo "sw.js تغییری نکرده؛ کامیتی لازم نیست."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "chore: به‌روزرسانی خودکار نسخهٔ کش Service Worker"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "push بعد از ۵ تلاش انجام نشد."
          exit 1
