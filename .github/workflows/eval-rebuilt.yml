name: Eval retrieval on rebuilt embeddings (ارزیابی بازیابی با بازسازی)
# مثل eval-chat.yml، ولی قبل از ارزیابی embeddings.json را با scripts/build-embeddings.js
# از روی همین شاخه از نو می‌سازد (فقط در فضای کار؛ هیچ‌چیز روی شاخه commit نمی‌شود) تا
# اثر تغییر تکه‌بندی/نرمال‌سازی قبل از ادغام سنجیده شود. فقط بازیابی (بدون /chat).
permissions:
  contents: write
on:
  workflow_dispatch:
    inputs:
      label:
        description: "نام نتیجه"
        required: true
        default: "rebuilt"
      args:
        description: "آرگومان‌های اضافه برای eval-chat.js"
        required: false
        default: "--normalize-query"
concurrency:
  group: eval-chat
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install cheerio
      - name: Rebuild embeddings.json (workspace only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/build-embeddings.js
      - name: Fetch previous results (for --vectors prev/<label>.json)
        run: |
          mkdir -p prev
          git fetch -q --depth 1 origin claude/eval-results && git archive FETCH_HEAD | tar -x -C prev || echo "نتیجهٔ قبلی نیست"
      - name: Run evaluation
        env:
          LABEL: ${{ inputs.label }}
          EXTRA_ARGS: ${{ inputs.args }}
        run: node scripts/eval-chat.js --label "$LABEL" --chat none $EXTRA_ARGS
      - name: Save results to claude/eval-results
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -e
          mkdir -p /tmp/res && cd /tmp/res
          git init -q -b claude/eval-results
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin claude/eval-results; then
            git checkout -q -B claude/eval-results FETCH_HEAD
          fi
          cp -r "$GITHUB_WORKSPACE/eval-results/." .
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "eval results: $LABEL" || { echo "چیزی برای ذخیره نیست"; exit 0; }
          for i in 1 2 3; do
            git push -q origin claude/eval-results && exit 0
            git fetch -q --depth 1 origin claude/eval-results && git rebase -q FETCH_HEAD || true
            sleep 3
          done
          exit 1
