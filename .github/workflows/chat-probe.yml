name: Chat probe (تست سلامت گفتگو با هوش)
# چند درخواست واقعی به /chat روی Worker زنده می‌فرستد و زمان و وضعیت هر
# کدام را گزارش می‌کند. فقط دستی (Run workflow) اجرا می‌شود؛ چیزی را
# commit یا deploy نمی‌کند. تست‌ها در .github/chat-probe/probe.json هستند.
permissions:
  contents: read
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run chat probe
        run: node scripts/chat-probe.js .github/chat-probe/probe.json
