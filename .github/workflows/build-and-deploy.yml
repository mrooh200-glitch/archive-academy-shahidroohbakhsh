name: Build embeddings & Deploy Worker
permissions:
  contents: write 
# Item جدید (رفع باگ: پوش‌های نزدیک‌به‌هم باعث تصادمِ commit می‌شدن):
# اگه چند پوش با فاصله‌ی کم اتفاق بیفته، هر پوش یه اجرای جدید شروع می‌کنه؛
# بدون این تنظیم، ممکنه دو اجرا هم‌زمان بخوان embeddings.json رو کامیت و
# پوش کنن - اجرایی که دیرتر می‌رسه با خطای «non-fast-forward» شکست
# می‌خوره چون شاخه‌ی main از زیرش در رفته. با این تنظیم، به‌محض شروعِ یه
# اجرای تازه (برای همون شاخه)، هر اجرای ناتمومِ قبلی به‌جای رقابت کردن،
# خودکار کنسل می‌شه - فقط آخرین پوش واقعاً تا انتها اجرا می‌شه.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch: # اجرای دستی از تب Actions در گیت‌هاب
  push:
    branches: [main]
    paths:
      - "**.htm"
      - "**.html"
      - "scripts/build-embeddings.js"
      - "worker/**"
jobs:
  build-embeddings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install cheerio
      # embeddings.json دیگه داخل گیت نگه‌داری نمی‌شه (هر نسخه ~۲۵ مگابایت به
      # تاریخچه اضافه می‌کرد). نسخهٔ قبلی از R2 گرفته می‌شه تا ساخت افزایشی
      # بمونه (فقط تکه‌های جدید embed بشن)، و نسخهٔ جدید دوباره به R2 می‌ره.
      - name: Download previous embeddings from R2 (ok if none yet)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object get roohbakhsh-embeddings/embeddings.json --file embeddings.json --remote
      - name: Build embeddings.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/build-embeddings.js
      - name: Upload embeddings.json to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put roohbakhsh-embeddings/embeddings.json --file embeddings.json --content-type application/json --remote
      - name: Upload embeddings-version.json to R2
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: r2 object put roohbakhsh-embeddings/embeddings-version.json --file embeddings-version.json --content-type application/json --remote
  deploy-worker:
    needs: build-embeddings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
