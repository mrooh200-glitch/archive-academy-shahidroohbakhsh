name: Build embeddings & Deploy Worker
permissions:
  contents: write 
# Item جدید (رفع باگ: پوش‌های نزدیک‌به‌هم باعث تصادمِ commit می‌شدن):
# اگه چند پوش با فاصله‌ی کم اتفاق بیفته، هر پوش یه اجرای جدید شروع می‌کنه؛
# بدون این تنظیم، ممکنه دو اجرا هم‌زمان بخوان embeddings.json رو کامیت و
# پوش کنن - اجرایی که دیرتر می‌رسه با خطای «non-fast-forward» شکست
# می‌خوره چون شاخه‌ی main از زیرش در رفته. با این تنظیم، به‌محض شروعِ یه
# اجرای تازه (برای همون شاخه)، هر اجرای ناتمومِ قبلی به‌جای رقابت کردن،
# خودکار کنسل می‌شه - فقط آخرین پوش واقعاً تا انتها اجرا می‌شه.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch: # اجرای دستی از تب Actions در گیت‌هاب
  push:
    branches: [main]
    paths:
      - "**.htm"
      - "**.html"
      - "scripts/build-embeddings.js"
      - "worker/**"
jobs:
  build-embeddings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install cheerio
      - name: Build embeddings.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/build-embeddings.js
      # رفع باگ (deploy نشدنِ Worker بعد از merge): وقتی یک push هم
      # search-widget.js و هم worker/ را عوض می‌کند، workflowِ «Update Service
      # Worker cache version» هم‌زمان اجرا می‌شود و زودتر روی main کامیت
      # می‌کند؛ push این‌جا با «non-fast-forward» رد می‌شد، job قرمز می‌شد و
      # deploy-worker اصلاً اجرا نمی‌شد. حالا قبل از push، تغییرات تازهٔ main
      # را می‌گیریم (rebase) و در صورت رقابت چند بار دوباره تلاش می‌کنیم.
      - name: Commit embeddings.json back to repo
        run: |
          git add embeddings.json embeddings-version.json
          if git diff --cached --quiet; then
            echo "embeddings تغییری نکرده؛ کامیتی لازم نیست."
            exit 0
          fi
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          git commit -m "chore: به‌روزرسانی خودکار embeddings.json"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            sleep $((i * 3))
          done
          echo "push بعد از ۵ تلاش انجام نشد."
          exit 1
  deploy-worker:
    needs: build-embeddings
    # کد Worker به embeddings.json وابسته نیست؛ اگر ساخت embeddings شکست
    # خورد، deploy نباید جا بماند (فقط اگر کل اجرا لغو شده باشد رد می‌شود).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Deploy Worker to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
