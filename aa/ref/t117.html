<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>این منبع در حال آماده‌سازی است</title>
<style>
  :root { --bg:#f6f3fb; --card:#ffffff; --ink:#2a2438; --muted:#6b6480; --accent:#5b2bc7; --green:#1f6b57; --line:#e3dcf1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17131f; --card:#221c2f; --ink:#ece8f6; --muted:#a79fbd; --accent:#b79bff; --green:#6fd3b3; --line:#362d49; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:Vazirmatn, Tahoma, Arial, sans-serif; display:flex; align-items:center; justify-content:center; padding:24px 16px; min-height:100vh; }
  .card { background:var(--card); border:1px solid var(--line); border-top:5px solid var(--accent); border-radius:14px; max-width:520px; width:100%; padding:32px 26px; text-align:center; box-shadow:0 6px 24px rgba(60,30,120,.08); }
  .icon { font-size:44px; line-height:1; margin-bottom:14px; }
  h1 { font-size:21px; margin:0 0 12px; color:var(--accent); font-weight:800; }
  p { font-size:16px; line-height:2; margin:0 0 10px; }
  .muted { color:var(--muted); font-size:14px; }
  .brand { margin-top:22px; padding-top:14px; border-top:1px solid var(--line); font-size:13px; color:var(--green); font-weight:700; }
</style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">⏳</div>
    <h1>این منبع در حال آماده‌سازی است</h1>
    <p>فایل مرجعِ این بخش هنوز روی سایت قرار نگرفته است. به‌زودی در همین نشانی منتشر می‌شود.</p>
    <p class="muted">لطفاً کمی بعد دوباره با اسکن همین کدِ QR یا بازکردن همین نشانی سر بزنید.</p>
    <div class="brand">پایگاه علمی‌پژوهشی شهید روحبخش</div>
  </main>
</body>
</html>
